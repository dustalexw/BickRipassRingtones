<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">BickRipassRingtones — Make a little noise.</title>
<desc id="desc">A purple and electric-lime macOS ringtone-library banner by dustalexw, with a B monogram cut through by a jagged waveform.</desc>
<defs>
 <linearGradient id="back" x2="1" y2="1"><stop stop-color="#2a0d4e"/><stop offset="1" stop-color="#130920"/></linearGradient>
 <linearGradient id="tile" x2=".8" y2="1"><stop stop-color="#8c37f5"/><stop offset="1" stop-color="#361060"/></linearGradient>
 <clipPath id="clip"><rect width="1280" height="440" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="440" fill="url(#back)"/>
<g fill="none" stroke="#8756ba" opacity=".16"><circle cx="1045" cy="218" r="190"/><circle cx="1045" cy="218" r="240"/><circle cx="1045" cy="218" r="290"/><circle cx="1045" cy="218" r="340"/></g>
<path d="M44 62H1236M44 390H1236" stroke="#6d408a" opacity=".55"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="48" y="42" font-size="11" font-weight="700" letter-spacing="3" fill="#c8ff33">NATIVE MACOS / PERSONAL RINGTONE LIBRARY</text>
 <text x="46" y="145" font-size="57" font-weight="800" letter-spacing="-2.6" fill="#faf4ff">BickRipassRingtones</text>
 <text x="48" y="214" font-size="43" font-weight="700" letter-spacing="-1.5" fill="#c8ff33">Make a little noise.</text>
 <text x="50" y="263" font-size="19" fill="#c5acd9">Your sounds. Your artwork. Your next ringtone.</text>
 <text x="50" y="320" font-size="11" font-weight="700" letter-spacing="2.5" fill="#ad8cc6">IMPORT AUDIO  /  CLICK TO PLAY  /  CUT  /  EXPORT</text>
 <text x="48" y="418" font-size="10" letter-spacing="2" fill="#b497c8">BUILT BY DUSTALEXW</text>
 <text x="1232" y="418" text-anchor="end" font-size="10" letter-spacing="2" fill="#b497c8">YOUR SOUNDS. YOUR MACHINE.</text>
</g>
<g transform="translate(918 94)">
 <rect x="7" y="11" width="258" height="258" rx="59" fill="#08030e" opacity=".4"/>
 <rect width="258" height="258" rx="59" fill="url(#tile)"/>
